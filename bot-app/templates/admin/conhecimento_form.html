{% extends 'admin/base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-xl-8">
    <div class="panel-card p-3 p-lg-4">
      <div class="mb-4">
        <h1 class="section-title mb-1">{{ title }}</h1>
        <p class="text-secondary mb-0">O bot usa essa resposta como fonte principal antes de recorrer à IA.</p>
      </div>
      <form method="post" action="{{ action_url }}" class="row g-3">
        <div class="col-12">
          <label class="form-label">Empresa</label>
          <select name="empresa_id" class="form-select" required>
            <option value="">Selecione</option>
            {% for empresa in empresas %}
            <option value="{{ empresa.id }}" {% if selected_empresa_id == empresa.id %}selected{% endif %}>{{ empresa.nome }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-12 col-lg-6">
          <label class="form-label">Categoria (opcional)</label>
          <input type="text" name="categoria" class="form-control" placeholder="Ex.: Convênios" value="{{ entrada.categoria if entrada and entrada.categoria else '' }}" />
        </div>
        <div class="col-12 col-lg-6 d-flex align-items-end">
          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" name="ativo" id="ativo" {% if entrada is none or entrada.ativo %}checked{% endif %} />
            <label class="form-check-label" for="ativo">Pergunta ativa</label>
          </div>
        </div>
        <div class="col-12">
          <label class="form-label">Pergunta</label>
          <input type="text" name="pergunta" class="form-control" required placeholder="Ex.: Aceita Unimed?" value="{{ entrada.pergunta if entrada else '' }}" />
        </div>
        <div class="col-12">
          <label class="form-label">Resposta</label>
          <textarea name="resposta" class="form-control" rows="4" required placeholder="Ex.: Sim, atendemos Unimed.">{{ entrada.resposta if entrada else '' }}</textarea>
        </div>
        <div class="col-12 d-flex justify-content-end gap-2 pt-2">
          <a href="/admin/conhecimento" class="btn btn-outline-secondary">Cancelar</a>
          <button type="submit" class="btn btn-brand">Salvar</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
