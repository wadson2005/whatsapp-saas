{% extends 'admin/base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-xl-6">
    <div class="panel-card p-3 p-lg-4">
      <div class="mb-4">
        <h1 class="section-title mb-1">Conectar WhatsApp</h1>
        <p class="text-secondary mb-0">Escaneie com o celular de <strong>{{ empresa.nome }}</strong> ({{ empresa.telefone_whatsapp }}). A página avança sozinha assim que conectar.</p>
      </div>

      {% include 'partials/qrcode_connect.html' %}

      <div class="text-center mt-3">
        <a href="/admin/empresas/{{ empresa.id }}/editar" class="btn btn-outline-secondary btn-sm">Voltar para a empresa</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
