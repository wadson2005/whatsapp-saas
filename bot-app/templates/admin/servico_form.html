{% extends 'admin/base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-xl-8">
    <div class="panel-card p-3 p-lg-4">
      <div class="mb-4">
        <h1 class="section-title mb-1">{{ title }}</h1>
        <p class="text-secondary mb-0">Mantenha a oferta da empresa atualizada sem acessar o banco manualmente.</p>
      </div>
      <form method="post" action="{{ action_url }}" class="row g-3">
        <div class="col-12">
          <label class="form-label">Empresa</label>
          <select name="empresa_id" class="form-select" required>
            <option value="">Selecione</option>
            {% for empresa in empresas %}
            <option value="{{ empresa.id }}" {% if selected_empresa_id == empresa.id %}selected{% endif %}>{{ empresa.nome }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-12 col-lg-8">
          <label class="form-label">Nome</label>
          <input type="text" name="nome" class="form-control" required value="{{ servico.nome if servico else '' }}" />
        </div>
        <div class="col-12 col-lg-4">
          <label class="form-label">Duração em minutos</label>
          <input type="number" name="duracao_minutos" class="form-control" min="1" step="1" required value="{{ servico.duracao_minutos if servico else 30 }}" />
        </div>
        <div class="col-12 col-lg-6">
          <label class="form-label">Preço</label>
          <input type="text" name="preco" class="form-control" placeholder="Ex.: 120.00" value="{{ servico.preco if servico and servico.preco is not none else '' }}" />
        </div>
        <div class="col-12 col-lg-6 d-flex align-items-end">
          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" name="ativo" id="ativo" {% if servico is none or servico.ativo %}checked{% endif %} />
            <label class="form-check-label" for="ativo">Serviço ativo</label>
          </div>
        </div>
        <div class="col-12 d-flex justify-content-end gap-2 pt-2">
          <a href="/admin/servicos" class="btn btn-outline-secondary">Cancelar</a>
          <button type="submit" class="btn btn-brand">Salvar</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
