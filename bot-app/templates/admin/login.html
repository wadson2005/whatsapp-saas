<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login - WhatsApp SaaS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
      body {
        min-height: 100vh;
        background: radial-gradient(circle at top, #24507b 0%, #123a5d 38%, #0c1f33 100%);
        color: #fff;
      }
      .login-card {
        border: 0;
        border-radius: 1.1rem;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
      }
      .brand-chip {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.4rem 0.8rem;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.12);
        color: #fff;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body class="d-flex align-items-center">
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-5">
          <div class="mb-4 text-center">
            <div class="brand-chip mb-3">WhatsApp SaaS</div>
            <h1 class="h3 fw-bold">Painel administrativo</h1>
            <p class="text-white-50 mb-0">Acesso para gestão de empresas, serviços e agendamentos.</p>
          </div>
          <div class="card login-card">
            <div class="card-body p-4 p-lg-5 text-dark">
              {% if error %}
              <div class="alert alert-danger">{{ error }}</div>
              {% endif %}
              <form method="post" action="/admin/login" class="vstack gap-3">
                <div>
                  <label class="form-label">Usuário ou e-mail</label>
                  <input type="text" name="username" class="form-control form-control-lg" autocomplete="username" required />
                </div>
                <div>
                  <label class="form-label">Senha</label>
                  <input type="password" name="password" class="form-control form-control-lg" autocomplete="current-password" required />
                </div>
                <button type="submit" class="btn btn-primary btn-lg w-100">Entrar</button>
              </form>
            </div>
          </div>
          <p class="text-white-50 small mt-3 text-center">Use as credenciais da sua empresa ou o acesso administrativo da plataforma.</p>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
