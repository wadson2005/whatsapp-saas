<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title or 'WhatsApp SaaS — Atendimento e agendamento automático pelo WhatsApp' }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
      :root {
        --bg: #f4f7fb;
        --surface: #ffffff;
        --text: #10243d;
        --muted: #5f6f85;
        --brand: #0f3d64;
        --brand-strong: #08263d;
        --accent: #0f766e;
        --border: #d9e3ef;
      }

      body {
        color: var(--text);
        background: var(--bg);
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      }

      a {
        color: var(--brand);
      }

      .site-nav {
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(8px);
        border-bottom: 1px solid var(--border);
      }

      .btn-brand {
        background: var(--brand);
        color: #fff;
        border-color: var(--brand);
      }

      .btn-brand:hover {
        background: var(--brand-strong);
        color: #fff;
      }

      .hero-section {
        background:
          radial-gradient(circle at top left, rgba(15, 61, 100, 0.12), transparent 30%),
          radial-gradient(circle at bottom right, rgba(15, 118, 110, 0.1), transparent 26%),
          linear-gradient(180deg, #eef3f9 0%, #f7f9fc 60%, var(--bg) 100%);
      }

      .hero-section h1 {
        font-weight: 800;
        letter-spacing: -0.03em;
        font-size: clamp(2.2rem, 4.5vw, 3.4rem);
      }

      .step-card,
      .beneficio-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 1rem;
        box-shadow: 0 12px 30px rgba(15, 23, 42, 0.05);
        height: 100%;
      }

      .step-number {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 2.5rem;
        height: 2.5rem;
        border-radius: 999px;
        background: rgba(15, 61, 100, 0.1);
        color: var(--brand);
        font-weight: 800;
      }

      .section-muted {
        color: var(--muted);
      }

      footer {
        background: var(--brand-strong);
        color: rgba(255, 255, 255, 0.85);
      }

      footer a {
        color: #fff;
      }

      .accordion-button:not(.collapsed) {
        color: var(--brand);
        background: rgba(15, 61, 100, 0.06);
      }

      .accordion-button:focus {
        box-shadow: 0 0 0 0.25rem rgba(15, 61, 100, 0.2);
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-md site-nav sticky-top">
      <div class="container py-2">
        <a class="navbar-brand fw-bold" href="/">WhatsApp SaaS</a>
        <div class="d-flex gap-2">
          <a href="/admin/login" class="btn btn-outline-secondary btn-sm">Entrar</a>
          <a href="/onboarding" class="btn btn-brand btn-sm">Criar minha conta</a>
        </div>
      </div>
    </nav>

    {% block content %}{% endblock %}

    <footer class="py-4 mt-5">
      <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center gap-2 small">
        <span>&copy; WhatsApp SaaS — atendimento e agendamento automático pelo WhatsApp.</span>
        <a href="/admin/login">Acesso administrativo</a>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
