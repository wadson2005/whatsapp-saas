# Configuração de ferramentas de desenvolvimento. A aplicação vive em bot-app/
# e suas dependências de runtime continuam em bot-app/requirements.txt.

[tool.pytest.ini_options]
testpaths = ["bot-app/tests"]
pythonpath = ["bot-app"]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["bot-app"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
