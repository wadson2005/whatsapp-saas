name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bot-app/requirements*.txt

      - name: Instalar dependências
        run: pip install -r bot-app/requirements-dev.txt

      - name: Lint
        run: ruff check bot-app

      - name: Testes
        run: pytest -q
